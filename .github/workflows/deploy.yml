name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, sqlite3, pdo_mysql

      - name: Install Composer dependencies
        run: |
          composer install --optimize-autoloader --no-dev --no-interaction --no-progress
          composer dump-autoload

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install npm dependencies
        run: npm install

      - name: Build frontend assets
        run: npm run build

      - name: Create .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Cache config
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

      - name: Prepare deployment files (flattened for HestiaCP)
        run: |
          mkdir -p /tmp/deploy
          rsync -a --exclude='.git' --exclude='.github' --exclude='node_modules' \
            --exclude='tests' --exclude='phpunit.xml' \
            . /tmp/deploy/
          # Flatten: move public/ contents to root (HestiaCP serves from public_html/)
          if [ -d /tmp/deploy/public ]; then
            rsync -a /tmp/deploy/public/ /tmp/deploy/
            rm -rf /tmp/deploy/public
          fi
          ls -la /tmp/deploy/.env && echo "✅ .env exists" || echo "⚠️ .env missing"
          ls /tmp/deploy/index.php && echo "✅ index.php at root" || echo "⚠️ index.php missing"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: artofex-deploy
          path: /tmp/deploy/
          retention-days: 7
