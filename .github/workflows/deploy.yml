name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, sqlite3, pdo_mysql

      - name: Install Composer dependencies
        run: |
          composer install --optimize-autoloader --no-dev --no-interaction --no-progress
          composer dump-autoload

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install npm dependencies
        run: npm install

      - name: Build frontend assets
        run: npm run build

      - name: Publish Filament assets
        run: php artisan filament:assets

      - name: Create .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Cache config
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

      - name: Prepare deployment files (flattened for HestiaCP)
        run: |
          mkdir -p /tmp/deploy
          rsync -a --exclude='.git' --exclude='.github' --exclude='node_modules' \
            --exclude='tests' --exclude='phpunit.xml' --exclude='deploy' \
            . /tmp/deploy/
          # Keep public/ intact (Vite manifest lives there), but copy boot files to root
          # HestiaCP serves from public_html/ directly, so root needs index.php
          if [ -d /tmp/deploy/public ]; then
            cp deploy/index.php /tmp/deploy/index.php
            cp deploy/setup.php /tmp/deploy/setup.php
            cp deploy/.htaccess /tmp/deploy/.htaccess
            cp /tmp/deploy/public/favicon.ico /tmp/deploy/favicon.ico 2>/dev/null || true
            cp /tmp/deploy/public/robots.txt /tmp/deploy/robots.txt 2>/dev/null || true
            # Copy build/ and Filament assets to root so browser can load them
            cp -r /tmp/deploy/public/build /tmp/deploy/build 2>/dev/null || true
            cp -r /tmp/deploy/public/css /tmp/deploy/css 2>/dev/null || true
            cp -r /tmp/deploy/public/js /tmp/deploy/js 2>/dev/null || true
            cp -r /tmp/deploy/public/fonts /tmp/deploy/fonts 2>/dev/null || true
          fi
          ls -la /tmp/deploy/.env && echo ".env exists" || echo ".env missing"
          ls /tmp/deploy/index.php && echo "index.php at root" || echo "index.php missing"
          ls /tmp/deploy/public/build/manifest.json && echo "Vite manifest preserved" || echo "Vite manifest missing"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: artofex-deploy
          path: /tmp/deploy/
          retention-days: 7
