name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, sqlite3, pdo_mysql

      - name: Install Composer dependencies
        run: |
          composer install --optimize-autoloader --no-dev --no-interaction --no-progress
          composer dump-autoload

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install npm dependencies
        run: npm install

      - name: Build frontend assets
        run: npm run build

      - name: Create .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Cache config
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

      - name: Prepare deployment files (flattened for HestiaCP)
        run: |
          mkdir -p /tmp/deploy
          rsync -a --exclude='.git' --exclude='.github' --exclude='node_modules' \
            --exclude='tests' --exclude='phpunit.xml' \
            . /tmp/deploy/
          # Keep public/ intact (Vite manifest lives there), but copy boot files to root
          # HestiaCP serves from public_html/ directly, so root needs index.php
          if [ -d /tmp/deploy/public ]; then
            # Write root-level index.php (flat paths: vendor/ is at root)
            cat > /tmp/deploy/index.php << 'PHPEOF'
<?php

use Illuminate\Foundation\Application;
use Illuminate\Http\Request;

define('LARAVEL_START', microtime(true));

if (file_exists($maintenance = __DIR__.'/storage/framework/maintenance.php')) {
    require $maintenance;
}

require __DIR__.'/vendor/autoload.php';

$app = require_once __DIR__.'/bootstrap/app.php';

$app->handleRequest(Request::capture());
PHPEOF
            # Write root-level setup.php
            cat > /tmp/deploy/setup.php << 'PHPEOF'
<?php

require __DIR__ . '/vendor/autoload.php';
$app = require __DIR__ . '/bootstrap/app.php';
$kernel = $app->make(Illuminate\Contracts\Console\Kernel::class);
$kernel->bootstrap();

$action = $_GET['action'] ?? '';

if ($action === 'clear') {
    Artisan::call('config:clear');
    Artisan::call('route:clear');
    Artisan::call('view:clear');
    echo '<h2>✅ All caches cleared</h2>';
    echo '<p><a href="/">Go to site →</a></p>';
    exit;
}

$output = [];
$errors = [];

try {
    DB::connection()->getPdo();
    $output[] = '✅ Database connected successfully';
} catch (\Exception $e) {
    $errors[] = '❌ Database connection failed: ' . $e->getMessage();
}

if (empty($errors)) {
    try {
        Artisan::call('migrate', ['--force' => true]);
        $output[] = '✅ Migrations run';
    } catch (\Exception $e) {
        $errors[] = '❌ Migrations failed: ' . $e->getMessage();
    }
}

try {
    Artisan::call('config:cache');
    $output[] = '✅ Config cached';
} catch (\Exception $e) {
    $errors[] = '❌ Config cache failed: ' . $e->getMessage();
}

try {
    Artisan::call('route:cache');
    $output[] = '✅ Routes cached';
} catch (\Exception $e) {
    $output[] = '⚠️ Route cache skipped (non-serializable routes)';
}

try {
    Artisan::call('view:cache');
    $output[] = '✅ Views cached';
} catch (\Exception $e) {
    $errors[] = '❌ View cache failed: ' . $e->getMessage();
}

try {
    Artisan::call('storage:link');
    $output[] = '✅ Storage link created';
} catch (\Exception $e) {
    $output[] = '⚠️ Storage link already exists or failed';
}

echo '<h2>Deployment Setup</h2>';
echo '<h3>Success:</h3><ul>';
foreach ($output as $line) {
    echo '<li>' . htmlspecialchars($line) . '</li>';
}
echo '</ul>';

if ($errors) {
    echo '<h3 style="color:red;">Errors:</h3><ul>';
    foreach ($errors as $line) {
        echo '<li style="color:red;">' . htmlspecialchars($line) . '</li>';
    }
    echo '</ul>';
} else {
    echo '<p style="color:green;font-size:18px;"><strong>✅ Setup complete!</strong></p>';
    echo '<p><a href="/" target="_blank">Go to site →</a></p>';
}
PHPEOF
            cp /tmp/deploy/public/.htaccess /tmp/deploy/.htaccess 2>/dev/null || true
            cp /tmp/deploy/public/favicon.ico /tmp/deploy/favicon.ico 2>/dev/null || true
            cp /tmp/deploy/public/robots.txt /tmp/deploy/robots.txt 2>/dev/null || true
          fi
          ls -la /tmp/deploy/.env && echo "✅ .env exists" || echo "⚠️ .env missing"
          ls /tmp/deploy/index.php && echo "✅ index.php at root" || echo "⚠️ index.php missing"
          ls /tmp/deploy/public/build/manifest.json && echo "✅ Vite manifest preserved" || echo "⚠️ Vite manifest missing"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: artofex-deploy
          path: /tmp/deploy/
          retention-days: 7
