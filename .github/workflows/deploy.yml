name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, sqlite3, pdo_mysql

      - name: Install Composer dependencies
        run: |
          composer install --optimize-autoloader --no-dev --no-interaction --no-progress
          composer dump-autoload

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install npm dependencies
        run: npm install

      - name: Build frontend assets
        run: npm run build

      - name: Create .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Cache config
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

      - name: Create deployment archive
        run: |
          zip -r /tmp/artofex-release.zip . \
            -x ".git/*" ".github/*" "node_modules/*" "tests/*" ".env.example" "phpunit.xml"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-archive
          path: /tmp/artofex-release.zip
          retention-days: 7
